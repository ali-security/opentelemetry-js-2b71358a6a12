name: Unit Tests
on:
  workflow_dispatch:

jobs:
  node-tests:
    strategy:
      fail-fast: false
      matrix:
        node_version:
          - "18.19.0"
          - "18"
          - "20.6.0"
          - "20"
          - "22"
          - "23"
          - "24"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: ${{ matrix.node_version }}

      # npm@11.0.0 drops support for Node.js v18
      # Install the latest npm compatible with this version of Node.js
      # - npm@11.1.0 supports: {"node":"^20.17.0 || >=22.9.0"}
      - run: npm install -g npm@"<11.0.0"
        if: ${{
          matrix.node_version == '18.19.0' ||
          matrix.node_version == '18' ||
          matrix.node_version == '20.6.0'
          }}
      - run: npm install -g npm@11.3.0
        if: ${{
          matrix.node_version == '20' ||
          matrix.node_version == '22' ||
          matrix.node_version == '23' ||
          matrix.node_version == '24'
          }}

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: npm run compile

      - run: npm test
        if: ${{ matrix.node_version != '22' && matrix.node_version != '23' && matrix.node_version != '24' }}
      # Node.js >= 23 type stripping conflicts with mocha usage of ts-node.
      # Node.js 22.18+ also enables type stripping by default, so the 22 leg
      # needs the same flag.
      # See https://github.com/open-telemetry/opentelemetry-js/issues/5415
      - run: npm test
        env:
          NODE_OPTIONS: '--no-experimental-strip-types'
        if: ${{ matrix.node_version == '22' || matrix.node_version == '23' || matrix.node_version == '24' }}

      - name: Pack @opentelemetry/core
        if: ${{ matrix.node_version == '23' }}
        run: |
          mkdir -p ./dist-pack
          npm pack --workspace=packages/opentelemetry-core --pack-destination=./dist-pack
          mv ./dist-pack/opentelemetry-core-2.0.1.tgz ./dist-pack/core-2.0.1.tgz
          ls -l ./dist-pack

      - name: Upload core tarball
        if: ${{ matrix.node_version == '23' }}
        uses: actions/upload-artifact@v4
        with:
          name: core-tgz
          path: dist-pack/core-2.0.1.tgz
          if-no-files-found: error
  node-windows-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: '22'

      - run: npm install -g npm@11.3.0

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: |
          npm config set script-shell "C:\\Program Files\\git\\bin\\bash.exe"
          npm run compile

      - name: Unit tests
        run: npm run test
        env:
          NODE_OPTIONS: '--no-experimental-strip-types'
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: 22

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: npm run compile

      - name: Unit tests
        run: npm run test:browser
  webworker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: 22

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: npm run compile

      - name: Unit tests
        run: npm run test:webworker
